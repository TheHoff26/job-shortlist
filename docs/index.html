<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Shortlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --ink:#16232E; --muted:#5A6A77; --line:#D3DCE2;
  --pine:#23604F; --pine-soft:#DCEBE5; --ochre:#9A6A12; --ochre-soft:#F3E7CC;
  --slate:#6D7C88; --slate-soft:#E4E9ED; --berry:#A3214A; --berry-soft:#F6DDE5;
  --focus:#2C6FB0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F171D; --surface:#16212A; --ink:#E3EAEF; --muted:#94A3AF; --line:#2A3945;
  --pine:#6CC3A6; --pine-soft:#173A31; --ochre:#E0B25A; --ochre-soft:#3A2E14;
  --slate:#9AA8B3; --slate-soft:#22303B; --berry:#F07A9C; --berry-soft:#3E1726; --focus:#7DB4EA;}}
:root[data-theme="dark"]{
  --bg:#0F171D; --surface:#16212A; --ink:#E3EAEF; --muted:#94A3AF; --line:#2A3945;
  --pine:#6CC3A6; --pine-soft:#173A31; --ochre:#E0B25A; --ochre-soft:#3A2E14;
  --slate:#9AA8B3; --slate-soft:#22303B; --berry:#F07A9C; --berry-soft:#3E1726; --focus:#7DB4EA;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 16px/1.55 "Schibsted Grotesk",system-ui,sans-serif;font-feature-settings:"tnum" 0}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:32px 16px 64px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 32px;margin-bottom:28px}
h1{font-size:clamp(28px,4vw,40px);line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:0}
.lede{color:var(--muted);margin:6px 0 0;max-width:60ch}
.tally{display:flex;gap:24px}
.tally div{font-size:14px;color:var(--muted)}
.tally b{display:block;font-size:28px;line-height:1;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.tally .new b{color:var(--berry)}
.layout{display:grid;grid-template-columns:240px 1fr;gap:32px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr;gap:16px}}
/* filters */
.filters{position:sticky;top:16px;display:grid;gap:16px}
@media (max-width:860px){.filters{position:static;grid-template-columns:1fr 1fr}.filters .full{grid-column:1/-1}}
.filters label{display:grid;gap:4px;font-size:14px;font-weight:600}
.filters input[type=search],.filters select{font:inherit;font-size:15px;font-weight:400;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.filters input[type=range]{width:100%;accent-color:var(--pine)}
.check{display:flex!important;grid-template-columns:none;align-items:center;gap:8px;font-weight:500!important}
.check input{width:18px;height:18px;accent-color:var(--berry)}
.small{font-size:13px;color:var(--muted)}
.downloads{display:flex;gap:12px;font-size:14px}
/* list */
.list{display:grid;gap:0;border-top:2px solid var(--ink)}
.job{display:grid;grid-template-columns:76px 1fr;gap:20px;padding:24px 0;border-bottom:1px solid var(--line)}
@media (max-width:560px){.job{grid-template-columns:56px 1fr;gap:14px}}
.gauge{position:relative;width:64px;height:64px}
@media (max-width:560px){.gauge{width:52px;height:52px}}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .trk{stroke:var(--line)}
.gauge span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
@media (max-width:560px){.gauge span{font-size:18px}}
.hi{--c:var(--pine)} .md{--c:var(--ochre)} .lo{--c:var(--slate)}
.gauge .val{stroke:var(--c)}
.gauge span{color:var(--c)}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.head h2{margin:0;font-size:20px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.head h2 a{text-decoration:none}
.head h2 a:hover{text-decoration:underline;text-underline-offset:3px}
.company{font-weight:600;color:var(--muted)}
.newtag{font-size:12px;font-weight:700;color:var(--berry);background:var(--berry-soft);border-radius:999px;padding:2px 8px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.facts li{font-size:13px;background:var(--slate-soft);border-radius:6px;padding:3px 8px}
.facts li.lvl{background:var(--c-soft,var(--slate-soft))}
.summary{margin:12px 0 0;max-width:72ch}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
.cols h3{font-size:14px;font-weight:700;margin:0 0 6px}
.cols ul{margin:0;padding-left:18px;font-size:15px}
.cols li{margin:2px 0}
.cols li.plus{color:var(--muted)}
.skills{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;align-items:center;font-size:13px}
.skills b{font-weight:600;color:var(--muted);margin-right:2px}
.skills span{background:var(--pine-soft);color:var(--pine);border-radius:999px;padding:2px 9px;font-weight:600}
details.why{margin-top:12px;font-size:14px;color:var(--muted)}
details.why summary{cursor:pointer;font-weight:600;width:max-content}
details.why ul{margin:6px 0 0;padding-left:18px}
.apply{display:inline-block;margin-top:14px;font-weight:700;color:var(--surface);background:var(--ink);
  text-decoration:none;border-radius:8px;padding:8px 14px;font-size:15px}
.apply:hover{background:var(--pine)}
.empty{padding:48px 0;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
footer{margin-top:40px;font-size:14px;color:var(--muted)}
footer table{border-collapse:collapse;margin-top:8px;font-size:13px}
footer td{padding:3px 14px 3px 0;border-bottom:1px solid var(--line)}
footer .bad{color:var(--berry)}
.li h2{font-size:15px;font-weight:700;margin:0}
.li p{margin:2px 0 8px}
.li ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:15px}
.li a{text-underline-offset:3px}
.li a:hover{color:var(--pine)}
.themebtn{font:inherit;font-size:14px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.gauge .val{transition:stroke-dashoffset .6s ease-out}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Job shortlist</h1>
      <p class="lede" id="lede">Open positions at the companies you follow, ranked against your profile.</p>
    </div>
    <div class="tally" aria-live="polite">
      <div><b id="t-shown">0</b>shown</div>
      <div class="new"><b id="t-new">0</b>new</div>
      <div><b id="t-co">0</b>companies</div>
    </div>
  </header>

  <div class="layout">
    <aside class="filters" aria-label="Filters">
      <label class="full">Search
        <input type="search" id="f-q" placeholder="Title, skill, location…">
      </label>
      <label>Company
        <select id="f-co"><option value="">All companies</option></select>
      </label>
      <label>Seniority
        <select id="f-lvl"><option value="">Any level</option></select>
      </label>
      <label>Workplace
        <select id="f-wp"><option value="">Any</option><option value="remote">Remote</option><option value="hybrid">Hybrid</option><option value="onsite">On-site</option></select>
      </label>
      <label>Sort by
        <select id="f-sort"><option value="score">Best match</option><option value="new">Newest first</option><option value="company">Company</option></select>
      </label>
      <label class="full">Minimum match: <span id="f-min-v">0</span>
        <input type="range" id="f-min" min="0" max="100" step="5" value="0">
      </label>
      <label class="check full"><input type="checkbox" id="f-new"> Only new positions</label>
      <div class="full">
        <p class="small" id="updated"></p>
        <div class="downloads"><a href="jobs.csv" download>Download CSV</a><a href="jobs.json">JSON</a></div>
      </div>
      <section class="full li" id="li" hidden aria-labelledby="li-h">
        <h2 id="li-h">Check LinkedIn</h2>
        <p class="small">Opens LinkedIn job search with your titles and location filled in.</p>
        <ul id="li-list"></ul>
      </section>
      <div class="full"><button class="themebtn" id="theme" type="button">Switch theme</button></div>
    </aside>

    <main>
      <div class="list" id="list"></div>
      <footer id="footer"></footer>
    </main>
  </div>
</div>

    add(j.years_experience ? j.years_experience + " experience" : "");
    add(j.education);
    add(j.languages.length ? j.languages.join(", ") : "");
    add(j.salary);
    add(j.posted ? "Posted " + j.posted : "");
    body.append(facts);

    if (j.summary) body.append(el("p", "summary", j.summary));

    const cols = el("div", "cols");
    if (j.responsibilities.length) cols.append(listBlock("What you would do", j.responsibilities));
    if (j.criteria.length || j.nice_to_have.length) cols.append(listBlock("What they ask for", j.criteria, j.nice_to_have));
    if (cols.children.length) body.append(cols);

    if (j.skills_matched.length){
      const sk = el("div", "skills"); sk.append(el("b", null, "Your skills mentioned"));
      j.skills_matched.forEach(s => sk.append(el("span", null, s)));
      body.append(sk);
    }
    if (j.reasons.length){
      const d = el("details", "why"); d.append(el("summary", null, "Why this score"));
      const ul = el("ul"); j.reasons.forEach(r => ul.append(el("li", null, r))); d.append(ul);
      body.append(d);
    }
    const ap = el("a", "apply", "Open posting"); ap.href = j.url; ap.target = "_blank"; ap.rel = "noopener";
    body.append(ap);
    a.append(body);
    return a;
  }

  function render(){
    const q = $("#f-q").value.trim().toLowerCase();
    const co = $("#f-co").value, lvl = $("#f-lvl").value, wp = $("#f-wp").value;
    const min = +$("#f-min").value, onlyNew = $("#f-new").checked, sort = $("#f-sort").value;
    $("#f-min-v").textContent = min;
    let rows = jobs.filter(j =>
      (!co || j.company === co) &&
      (!lvl || (lvl === "-" ? !j.seniority : j.seniority === lvl)) &&
      (!wp || j.workplace === wp) &&
      j.score >= min && (!onlyNew || j.is_new) &&
      (!q || [j.title, j.company, j.location, j.summary, ...j.criteria, ...j.skills_matched].join(" ").toLowerCase().includes(q)));
    if (sort === "new") rows.sort((a,b) => (b.first_seen||"").localeCompare(a.first_seen||"") || b.score - a.score);
    else if (sort === "company") rows.sort((a,b) => a.company.localeCompare(b.company) || b.score - a.score);
    else rows.sort((a,b) => b.score - a.score);

    const list = $("#list"); list.replaceChildren();
    if (!rows.length){
      const e = el("div", "empty");
      e.append(el("b", null, jobs.length ? "No positions match these filters" : "No matching positions right now"));
      e.append(document.createTextNode(jobs.length ? "Lower the minimum match or clear the search." :
        "Widen the titles or locations in config/profile.yaml, or add companies in config/companies.yaml."));
      list.append(e);
    } else rows.forEach(j => list.append(card(j)));
    $("#t-shown").textContent = rows.length;
    $("#t-new").textContent = rows.filter(j => j.is_new).length;
    $("#t-co").textContent = new Set(rows.map(j => j.company)).size;
  }
  ["#f-q","#f-co","#f-lvl","#f-wp","#f-sort","#f-min","#f-new"].forEach(s => $(s).addEventListener("input", render));

  // LinkedIn search links
  if ((meta.linkedin || []).length){
    meta.linkedin.forEach(l => {
      const li = el("li"), a = el("a", null, l.company);
      a.href = l.url; a.target = "_blank"; a.rel = "noopener";
      li.append(a); $("#li-list").append(li);
    });
    $("#li").hidden = false;
  }

  // footer: source status
  const f = $("#footer");
  f.append(el("div", null, "Sources checked on the last run"));
  const t = el("table");
  meta.companies.forEach(c => {
    const tr = el("tr");
    tr.append(el("td", null, c.company), el("td", null, c.ats),
      el("td", c.ok ? null : "bad", !c.ok ? "Failed: " + c.error : c.error === "link only" ? "LinkedIn link only" : `${c.count} title matches`));
    t.append(tr);
  });
  f.append(t);
  render();
})();
</script>
</body>
</html>
