# ---------------------------------------------------------------------------
# Companies are managed in the Company Scout register:
#   https://thehoff26.github.io/company-scout/
#
# The job search reads the register at every run. Companies with status
# "paused" are skipped. Companies without a readable job system get a LinkedIn
# search link on the job page instead.
#
# If the register can't be reached, the copy from the last run is used
# (data/register-cache.json).
# ---------------------------------------------------------------------------

register: https://thehoff26.github.io/company-scout/companies.json

# Optional: extra companies that are NOT in the register (same format as before,
# e.g.  - {name: Example Oy, ats: workday, url: https://...}). Normally empty.
companies: []
