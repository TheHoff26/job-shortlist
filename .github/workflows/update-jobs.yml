name: Update job shortlist

on:
  schedule:
    - cron: "41 4 * * *"       # daily 04:41 UTC (~06:41 Helsinki in winter)
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["config/**", "jobfinder/**"]

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main                  # always start from the newest state (runs can queue)

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and rank positions
        env:
          JOBFINDER_CV_TEXT: ${{ secrets.JOBFINDER_CV_TEXT }}
        run: python -m jobfinder

      - name: Publish updated site
        run: |
          git config user.name "jobfinder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data config
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update job shortlist $(date -u +%F)"
          # Another run or a page save may have pushed meanwhile. Rebase onto it;
          # where both changed the generated files, keep this run's newer result.
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Could not publish after 3 attempts"
          exit 1
